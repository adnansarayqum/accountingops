name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} / quality + PostgreSQL
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accountingops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accountingops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/accountingops_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test (DB preflight prevents silent critical-suite skips)
        run: npm run test:ci
      - run: npm run build
      - run: npm audit --audit-level=moderate

  browser-smoke:
    name: Browser-only smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
